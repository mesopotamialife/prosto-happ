name: Build Prosto Happ

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare build directory
        shell: cmd
        run: |
          if not exist build mkdir build

      - name: Compile resources
        shell: cmd
        run: |
          rc.exe /fo build\app.res src\app.rc

      - name: Compile and link
        shell: cmd
        run: |
          cl.exe /nologo /O2 /MT /DWINVER=0x0601 /D_WIN32_WINNT=0x0601 /EHsc src\main.cpp build\app.res /link /SUBSYSTEM:WINDOWS /OUT:build\ProstoHapp.exe

      - name: Check executable
        shell: cmd
        run: |
          if not exist build\ProstoHapp.exe exit /b 1
          dir build\ProstoHapp.exe

      - name: Upload ProstoHapp.exe
        uses: actions/upload-artifact@v4
        with:
          name: ProstoHapp-x64
          path: build\ProstoHapp.exe
          if-no-files-found: error
